<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Training Card</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F2F2F7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .card {
    background: #FFFFFF;
    border-radius: 16px;
    width: 370px;
    border: 1px solid rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* Header with thumbnail */
  .card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 20px 16px;
  }

  .thumbnail {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #035CD5, #5EABF7);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .thumbnail svg {
    width: 28px;
    height: 28px;
    fill: white;
  }

  .header-text {
    flex: 1;
    min-width: 0;
  }

  .skill-label {
    font-size: 12px;
    font-weight: 600;
    color: #0061EB;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .skill-title {
    font-size: 20px;
    font-weight: 700;
    color: #1C1C1E;
    line-height: 1.2;
  }

  .edit-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #F2F2F7;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .edit-btn:hover {
    background: #E5E5EA;
  }

  .edit-btn svg {
    width: 18px;
    height: 18px;
    color: #8E8E93;
  }

  /* Stats Row */
  .stats-row {
    display: flex;
    gap: 8px;
    padding: 0 20px 16px;
  }

  .stat-item {
    flex: 1;
    background: #F2F2F7;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }

  .stat-icon {
    width: 20px;
    height: 20px;
    margin: 0 auto 6px;
    color: #8E8E93;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: #1C1C1E;
    line-height: 1.2;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 500;
    color: #8E8E93;
    margin-top: 2px;
  }

  /* Progress Section */
  .progress-section {
    padding: 0 20px 20px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-label {
    font-size: 14px;
    font-weight: 600;
    color: #1C1C1E;
  }

  .progress-value {
    font-size: 14px;
    font-weight: 700;
    color: #0061EB;
  }

  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: #E5E5EA;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    width: 65%;
    height: 100%;
    background: linear-gradient(90deg, #0061EB, #5EABF7);
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: rgba(0,0,0,0.06);
    margin: 0 20px;
  }

  /* Action Buttons */
  .actions {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #0061EB;
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
  }

  .btn-primary:hover {
    background: #0055D0;
  }

  .btn-primary svg {
    width: 20px;
    height: 20px;
    fill: white;
  }

  .btn-secondary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #F2F2F7;
    color: #1C1C1E;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
  }

  .btn-secondary:hover {
    background: #E5E5EA;
  }

  .btn-secondary svg {
    width: 18px;
    height: 18px;
    color: #8E8E93;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Header -->
  <div class="card-header">
    <div class="thumbnail">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
    </div>
    <div class="header-text">
      <div class="skill-label">Current Skill</div>
      <div class="skill-title">Tuck Planche</div>
    </div>
    <button class="edit-btn" title="Edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="5" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-item">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <div class="stat-value">24</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat-item">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <div class="stat-value">8h 30m</div>
      <div class="stat-label">Duration</div>
    </div>
    <div class="stat-item">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <div class="stat-value">65%</div>
      <div class="stat-label">Progress</div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">Overall Progress</span>
      <span class="progress-value">65%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-primary">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      Start Training
    </button>
    <button class="btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      Update Progress
    </button>
  </div>
</div>

</body>
</html>
