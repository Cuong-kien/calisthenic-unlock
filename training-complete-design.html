<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Complete - Planche App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone-frame {
    width: 393px;
    height: 852px;
    background: #000;
    border-radius: 44px;
    border: 3px solid #333;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Dynamic Island */
  .dynamic-island {
    width: 126px;
    height: 37px;
    background: #1a1a1a;
    border-radius: 20px;
    margin: 12px auto 0;
    position: relative;
    z-index: 10;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
    padding-top: 40px;
  }

  .spacer-top { flex: 1; }

  /* Badge with glow rings */
  .badge-container {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    animation: badgeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .glow-ring-outer {
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(0, 122, 255, 0.08);
  }

  .glow-ring-inner {
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(0, 122, 255, 0.15);
  }

  .checkmark-icon {
    position: relative;
    z-index: 2;
    font-size: 56px;
    color: #007AFF;
    filter: drop-shadow(0 4px 12px rgba(0, 122, 255, 0.4));
  }

  /* Sparkle dots */
  .sparkle {
    position: absolute;
    border-radius: 50%;
    animation: sparkleAnim 1.2s ease-in-out infinite alternate;
  }
  .sparkle-1 { width: 6px; height: 6px; top: 10px; left: 20px; background: #FFD700; animation-delay: 0s; }
  .sparkle-2 { width: 4px; height: 4px; top: 15px; right: 35px; background: #FFD700; animation-delay: 0.2s; }
  .sparkle-3 { width: 5px; height: 5px; bottom: 20px; right: 15px; background: #FFD700; animation-delay: 0.4s; }
  .sparkle-4 { width: 5px; height: 5px; bottom: 15px; left: 25px; background: #035CD5; animation-delay: 0.6s; }
  .sparkle-5 { width: 4px; height: 4px; top: 55px; right: 5px; background: #035CD5; animation-delay: 0.3s; }
  .sparkle-6 { width: 5px; height: 5px; top: 75px; left: 5px; background: #5EABF7; animation-delay: 0.5s; }
  .sparkle-7 { width: 4px; height: 4px; bottom: 35px; right: 40px; background: #5EABF7; animation-delay: 0.7s; }
  .sparkle-8 { width: 6px; height: 6px; top: 8px; left: 48px; background: #5EABF7; animation-delay: 0.1s; }

  /* Title */
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    opacity: 0;
    animation: fadeIn 0.4s ease-out 0.3s forwards;
  }

  .subtitle {
    font-size: 15px;
    color: #999;
    text-align: center;
    margin-top: 8px;
    line-height: 1.4;
    opacity: 0;
    animation: fadeIn 0.4s ease-out 0.35s forwards;
  }

  /* Stat Cards — vertical stack */
  .stat-cards {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transform: translateY(30px);
    animation: slideUp 0.4s ease-out 0.5s forwards;
  }

  .stat-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: rgba(120, 120, 128, 0.2);
    border-radius: 12px;
  }

  .stat-card .info .label {
    font-size: 13px;
    color: #8E8E93;
    font-weight: 400;
  }

  .stat-card .info .value {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.45px;
    color: #fff;
    margin-top: 4px;
  }

  .stat-card .card-icon {
    font-size: 18px;
    color: #8E8E93;
  }

  .spacer-bottom { flex: 1; }

  /* Separator */
  .separator {
    width: 100%;
    height: 1px;
    background: rgba(255, 255, 255, 0.2);
    margin-bottom: 16px;
  }

  /* Buttons */
  .buttons {
    width: 100%;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeIn 0.4s ease-out 0.7s forwards;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:active { transform: scale(0.98); }

  .btn-secondary {
    background: #F2F2F7;
    color: #666;
    margin-bottom: 12px;
  }

  .btn-primary {
    background: #007AFF;
    color: #fff;
  }

  .btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  /* Home indicator */
  .home-indicator {
    width: 134px;
    height: 5px;
    background: #666;
    border-radius: 3px;
    margin: 0 auto 8px;
  }

  /* Animations */
  @keyframes badgeIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes slideUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes sparkleAnim {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="dynamic-island"></div>

  <div class="content">
    <div class="spacer-top"></div>

    <!-- Blue checkmark badge with glow -->
    <div class="badge-container">
      <div class="glow-ring-outer"></div>
      <div class="glow-ring-inner"></div>
      <div class="sparkle sparkle-1"></div>
      <div class="sparkle sparkle-2"></div>
      <div class="sparkle sparkle-3"></div>
      <div class="sparkle sparkle-4"></div>
      <div class="sparkle sparkle-5"></div>
      <div class="sparkle sparkle-6"></div>
      <div class="sparkle sparkle-7"></div>
      <div class="sparkle sparkle-8"></div>
      <div class="checkmark-icon">✓</div>
    </div>

    <!-- Title -->
    <div class="title">CONGRATULATIONS!</div>
    <p class="subtitle">You've completed your training session</p>

    <!-- Stat cards (vertical) -->
    <div class="stat-cards">
      <div class="stat-card">
        <div class="info">
          <div class="label">Skill</div>
          <div class="value">Tuck Planche</div>
        </div>
        <div class="card-icon">🏋️</div>
      </div>
      <div class="stat-card">
        <div class="info">
          <div class="label">Duration</div>
          <div class="value">12m 34s</div>
        </div>
        <div class="card-icon">🕐</div>
      </div>
    </div>

    <div class="spacer-bottom"></div>

    <!-- Buttons -->
    <div class="buttons">
      <div class="separator"></div>
      <button class="btn btn-secondary">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        Update process
      </button>
      <button class="btn btn-primary">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Back to Home
      </button>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

</body>
</html>
